{% extends "base.html" %}

{% block title %}Editar Película{% endblock %}

{% block content %}
<h1 class="title">Editar Película</h1>

<form action="/peliculas/editar/{{ pelicula.id }}" method="post" class="box">

  <div class="field">
    <label class="label">Título</label>
    <div class="control">
      <input class="input" type="text" name="titulo" value="{{ pelicula.titulo }}" required>
    </div>
  </div>

  <div class="field">
    <label class="label">Género</label>
    <div class="control">
      <input class="input" type="text" name="genero" value="{{ pelicula.genero }}" required>
    </div>
  </div>

  <div class="field">
    <label class="label">Año</label>
    <div class="control">
      <input class="input" type="number" name="anio" value="{{ pelicula.anio }}" required>
    </div>
  </div>

  <div class="field">
    <label class="label">Estudio</label>
    <div class="control">
      <input class="input" type="text" name="estudio" value="{{ pelicula.estudio }}" required>
    </div>
  </div>

  <div class="field">
    <label class="label">URL Imagen</label>
    <div class="control">
      <input class="input" type="url" name="img_url" value="{{ pelicula.img_url }}">
    </div>
  </div>

  <button class="button is-primary" type="submit">Guardar cambios</button>
</form>
{% endblock %}
