{% extends "base.html" %}

{% block title %}Crear Película{% endblock %}

{% block content %}
<h1 class="title">Crear nueva película</h1>

<form action="/peliculas/crear" method="post" class="box">
  <div class="field">
    <label class="label">Título</label>
    <div class="control">
      <input class="input" type="text" id="titulo" name="titulo" placeholder="Ej: Toy Story" required>
    </div>
  </div>

  <div class="field">
    <label class="label">Género</label>
    <div class="control">
      <input class="input" type="text" id="genero" name="genero" placeholder="Ej: Animación" required>
    </div>
  </div>

  <div class="field">
    <label class="label">Año</label>
    <div class="control">
      <input class="input" type="number" id="anio" name="anio" placeholder="Ej: 1995" required>
    </div>
  </div>

  <div class="field">
    <label class="label">Estudio</label>
    <div class="control">
      <input class="input" type="text" id="estudio" name="estudio" placeholder="Ej: Disney" required>
    </div>
  </div>

  <div class="field">
    <label class="label">URL imagen</label>
    <div class="control">
      <input class="input" type="url" id="url_imagen" name="img_url" placeholder="https://...">
    </div>
  </div>

  <div class="field is-grouped">
    <div class="control">
      <button class="button is-primary" type="submit">
        <span class="icon"><i class="fas fa-save"></i></span>
        <span>Guardar</span>
      </button>
    </div>
    <div class="control">
      <a class="button is-light" href="/peliculas/view">Cancelar</a>
    </div>
  </div>
</form>
{% endblock %}
