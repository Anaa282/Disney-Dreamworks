{% extends "base.html" %}

{% block title %}Inicio - CineApp{% endblock %}

{% block content %}
  <h1 class="title">Bienvenido a CineApp</h1>
  <p class="subtitle">Agrega tus películas y personajes de DreamWorks y Disney.</p>

  <div class="columns is-centered">
    <div class="column is-one-third has-text-centered">
      <figure class="image is-3by2 mx-auto" style="max-width: 500px;">
        <img src="/static/dny.jpg" alt="Disney" style="object-fit: cover; width: 100%; height: 100%;">
      </figure>
    </div>
    <div class="column is-one-third has-text-centered">
      <figure class="image is-3by2 mx-auto" style="max-width: 500px;">
        <img src="/static/dw1.jpg" alt="DreamWorks" style="object-fit: cover; width: 100%; height: 100%;">
      </figure>
    </div>
  </div>

  <div class="has-text-centered mt-4">
    <a class="button is-primary is-rounded is-medium mx-2" href="/peliculas/view">
      <span class="icon"><i class="fas fa-video"></i></span>
      <span>Ver Películas</span>
    </a>
    <a class="button is-link is-rounded is-medium mx-2" href="/personajes/view">
      <span class="icon"><i class="fas fa-user"></i></span>
      <span>Ver Personajes</span>
    </a>
  </div>
{% endblock %}
